name: Bioconda PR Manual

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to submit (example 1.3.1)
        required: true
        type: string

env:
  PYPI_NAME: tau-community-detection
  RECIPE_PATH: recipes/tau-community-detection/meta.yaml
  UPSTREAM_BIOCONDA_REPO: bioconda/bioconda-recipes

jobs:
  open-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Resolve version
        id: v
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Get PyPI sdist sha256
        id: pypi
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.v.outputs.version }}"
          curl -fsSL "https://pypi.org/pypi/${PYPI_NAME}/${VERSION}/json" > pypi.json
          SHA256="$(python -c "import json; d=json.load(open('pypi.json', 'r', encoding='utf-8')); print(next(u['digests']['sha256'] for u in d.get('urls', []) if u.get('packagetype') == 'sdist'))")"
          echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"

      - name: Checkout bioconda fork
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.BIOCONDA_FORK_REPO }}
          token: ${{ secrets.BIOCONDA_PAT }}
          ref: master
          fetch-depth: 0
          path: bioconda-recipes

      - name: Update recipe
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.v.outputs.version }}"
          SHA256="${{ steps.pypi.outputs.sha256 }}"
          FILE="bioconda-recipes/${RECIPE_PATH}"

          python -c "import pathlib,re,sys; p=pathlib.Path(sys.argv[1]); version=sys.argv[2]; sha=sys.argv[3]; t=p.read_text(encoding='utf-8'); t,n1=re.subn(r'^(\\s*\\{\\%\\s*set\\s+version\\s*=\\s*\")[^\"]+(\"\\s*\\%\\}\\s*)$', rf'\\g<1>{version}\\2', t, flags=re.MULTILINE); t,n1=(re.subn(r'^(\\s*version:\\s*).*(\\s*)$', rf'\\g<1>{version}\\2', t, flags=re.MULTILINE) if n1==0 else (t,n1)); t,n2=re.subn(r'^(\\s*sha256:\\s*).*(\\s*)$', rf'\\g<1>{sha}\\2', t, flags=re.MULTILINE); (n1 and n2) or (_ for _ in ()).throw(SystemExit('Could not update version/sha256 in recipe')); p.write_text(t, encoding='utf-8')" "${FILE}" "${VERSION}" "${SHA256}"

      - name: Commit and push branch
        id: commit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.BIOCONDA_PAT }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.v.outputs.version }}"
          BRANCH="bump-${PYPI_NAME}-${VERSION}"

          cd bioconda-recipes
          if git diff --quiet -- "${RECIPE_PATH}"; then
            echo "No recipe changes detected."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          FILE_SHA="$(gh api "/repos/${{ secrets.BIOCONDA_FORK_REPO }}/contents/${RECIPE_PATH}" --jq '.sha')"
          FILE_CONTENT="$(base64 -w 0 "${RECIPE_PATH}")"

          MASTER_SHA="$(gh api "/repos/${{ secrets.BIOCONDA_FORK_REPO }}/git/ref/heads/master" --jq '.object.sha')"
          gh api --method DELETE "/repos/${{ secrets.BIOCONDA_FORK_REPO }}/git/refs/heads/${BRANCH}" || true
          gh api --method POST "/repos/${{ secrets.BIOCONDA_FORK_REPO }}/git/refs" \
            --field ref="refs/heads/${BRANCH}" \
            --field sha="${MASTER_SHA}"

          gh api --method PUT "/repos/${{ secrets.BIOCONDA_FORK_REPO }}/contents/${RECIPE_PATH}" \
            --field message="bioconda: bump ${PYPI_NAME} to ${VERSION}" \
            --field content="${FILE_CONTENT}" \
            --field sha="${FILE_SHA}" \
            --field branch="${BRANCH}"

          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Open PR
        if: steps.commit.outputs.has_changes == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.BIOCONDA_PAT }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.v.outputs.version }}"
          BRANCH="${{ steps.commit.outputs.branch }}"
          HEAD_REF="${{ secrets.BIOCONDA_FORK_OWNER }}:${BRANCH}"

          EXISTING_PR="$(gh pr list --repo "${UPSTREAM_BIOCONDA_REPO}" --head "${HEAD_REF}" --json number --jq '.[0].number')"
          if [[ -n "${EXISTING_PR}" ]]; then
            echo "PR exists: #${EXISTING_PR}"
            exit 0
          fi

          gh pr create \
            --repo "${UPSTREAM_BIOCONDA_REPO}" \
            --base master \
            --head "${HEAD_REF}" \
            --title "bioconda: bump ${PYPI_NAME} to ${VERSION}" \
            --body "Automated update after PyPI release ${VERSION}."
