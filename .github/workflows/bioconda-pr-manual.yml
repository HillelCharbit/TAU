name: Bioconda PR Manual

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to submit (example 1.3.1)
        required: true
        type: string

env:
  PYPI_NAME: tau-community-detection
  RECIPE_PATH: recipes/tau-community-detection/meta.yaml
  UPSTREAM_BIOCONDA_REPO: bioconda/bioconda-recipes

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve version
        id: v
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Get PyPI sdist sha256
        id: pypi
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.v.outputs.version }}"
          curl -fsSL "https://pypi.org/pypi/${PYPI_NAME}/${VERSION}/json" > pypi.json
          SHA256="$(python - <<'PY'
import json
with open('pypi.json', 'r', encoding='utf-8') as f:
    data = json.load(f)
for u in data.get('urls', []):
    if u.get('packagetype') == 'sdist':
        print(u['digests']['sha256'])
        break
else:
    raise SystemExit('No sdist found')
PY
)"
          echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"

      - name: Checkout bioconda fork
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.BIOCONDA_FORK_REPO }}
          token: ${{ secrets.BIOCONDA_TOKEN }}
          ref: master
          path: bioconda-recipes

      - name: Update recipe
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.v.outputs.version }}"
          SHA256="${{ steps.pypi.outputs.sha256 }}"
          FILE="bioconda-recipes/${RECIPE_PATH}"

          python - <<'PY'
import os
import re

file_path = os.environ['FILE']
version = os.environ['VERSION']
sha256 = os.environ['SHA256']

with open(file_path, 'r', encoding='utf-8') as f:
    text = f.read()

text, c1 = re.subn(r'^(\s*\{\%\s*set\s+version\s*=\s*")[^"]+("\s*\%\}\s*)$', rf'\g<1>{version}\2', text, flags=re.MULTILINE)
if c1 == 0:
    text, c1 = re.subn(r'^(\s*version:\s*)[0-9A-Za-z._-]+(\s*)$', rf'\g<1>{version}\2', text, flags=re.MULTILINE)
text, c2 = re.subn(r'^(\s*sha256:\s*)[0-9a-f]{64}(\s*)$', rf'\g<1>{sha256}\2', text, flags=re.MULTILINE)

if c1 == 0:
    raise SystemExit('Could not update version in recipe')
if c2 == 0:
    raise SystemExit('Could not update sha256 in recipe')

with open(file_path, 'w', encoding='utf-8') as f:
    f.write(text)
PY
        env:
          FILE: bioconda-recipes/${{ env.RECIPE_PATH }}
          VERSION: ${{ steps.v.outputs.version }}
          SHA256: ${{ steps.pypi.outputs.sha256 }}

      - name: Commit and push branch
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.v.outputs.version }}"
          BRANCH="bump-${PYPI_NAME}-${VERSION}"

          cd bioconda-recipes
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "${BRANCH}"

          if git diff --quiet -- "${RECIPE_PATH}"; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git add "${RECIPE_PATH}"
          git commit -m "bioconda: bump ${PYPI_NAME} to ${VERSION}"
          git push --force-with-lease origin "${BRANCH}"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Open PR
        if: steps.commit.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.BIOCONDA_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.v.outputs.version }}"
          BRANCH="${{ steps.commit.outputs.branch }}"
          HEAD_REF="${{ secrets.BIOCONDA_FORK_OWNER }}:${BRANCH}"

          EXISTING_PR="$(gh pr list --repo "${UPSTREAM_BIOCONDA_REPO}" --head "${HEAD_REF}" --json number --jq '.[0].number')"
          if [[ -n "${EXISTING_PR}" ]]; then
            echo "PR exists: #${EXISTING_PR}"
            exit 0
          fi

          gh pr create \
            --repo "${UPSTREAM_BIOCONDA_REPO}" \
            --base master \
            --head "${HEAD_REF}" \
            --title "bioconda: bump ${PYPI_NAME} to ${VERSION}" \
            --body "Automated update after PyPI release ${VERSION}."
