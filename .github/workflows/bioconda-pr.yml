name: Open Bioconda Recipe PR

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to submit (example: 1.3.1)."
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PYPI_NAME: tau-community-detection
  RECIPE_PATH: recipes/tau-community-detection/meta.yaml
  UPSTREAM_BIOCONDA_REPO: bioconda/bioconda-recipes

jobs:
  open-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          INPUT_VERSION="${{ github.event.inputs.version }}"
          if [[ -n "${INPUT_VERSION}" ]]; then
            VERSION="${INPUT_VERSION#v}"
          elif [[ "${{ github.event_name }}" == "release" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            echo "No version available. Use workflow_dispatch and provide version."
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Get sdist metadata from PyPI
        id: pypi
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          curl -fsSL "https://pypi.org/pypi/${PYPI_NAME}/${VERSION}/json" > pypi.json
          SHA256="$(python -c "import json; d=json.load(open('pypi.json', 'r', encoding='utf-8')); print(next(u['digests']['sha256'] for u in d.get('urls', []) if u.get('packagetype') == 'sdist'))")"
          echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"

      - name: Checkout bioconda-recipes fork
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.BIOCONDA_FORK_REPO }}
          token: ${{ secrets.BIOCONDA_TOKEN }}
          ref: master
          path: bioconda-recipes

      - name: Update recipe version and sha
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          SHA256="${{ steps.pypi.outputs.sha256 }}"
          FILE="bioconda-recipes/${RECIPE_PATH}"

          python -c "import pathlib,re,sys; p=pathlib.Path(sys.argv[1]); version=sys.argv[2]; sha=sys.argv[3]; t=p.read_text(encoding='utf-8'); t,n1=re.subn(r'^(\\s*\\{\\%\\s*set\\s+version\\s*=\\s*\")[^\"]+(\"\\s*\\%\\}\\s*)$', rf'\\g<1>{version}\\2', t, flags=re.MULTILINE); t,n1=(re.subn(r'^(\\s*version:\\s*).*(\\s*)$', rf'\\g<1>{version}\\2', t, flags=re.MULTILINE) if n1==0 else (t,n1)); t,n2=re.subn(r'^(\\s*sha256:\\s*).*(\\s*)$', rf'\\g<1>{sha}\\2', t, flags=re.MULTILINE); (n1 and n2) or (_ for _ in ()).throw(SystemExit('Could not update version/sha256 in recipe')); p.write_text(t, encoding='utf-8')" "${FILE}" "${VERSION}" "${SHA256}"

      - name: Commit and push branch
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          BRANCH="bump-${PYPI_NAME}-${VERSION}"

          cd bioconda-recipes
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "${BRANCH}"

          if git diff --quiet -- "${RECIPE_PATH}"; then
            echo "No recipe changes detected."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git add "${RECIPE_PATH}"
          git commit -m "bioconda: bump ${PYPI_NAME} to ${VERSION}"
          git push --force-with-lease origin "${BRANCH}"

          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Open or update PR
        if: steps.commit.outputs.has_changes == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.BIOCONDA_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          BRANCH="${{ steps.commit.outputs.branch }}"
          HEAD_REF="${{ secrets.BIOCONDA_FORK_OWNER }}:${BRANCH}"

          EXISTING_PR_NUMBER="$(gh pr list \
            --repo "${UPSTREAM_BIOCONDA_REPO}" \
            --head "${HEAD_REF}" \
            --json number \
            --jq '.[0].number')"

          if [[ -n "${EXISTING_PR_NUMBER}" ]]; then
            echo "PR #${EXISTING_PR_NUMBER} already exists for ${HEAD_REF}."
            exit 0
          fi

          gh pr create \
            --repo "${UPSTREAM_BIOCONDA_REPO}" \
            --base master \
            --head "${HEAD_REF}" \
            --title "bioconda: bump ${PYPI_NAME} to ${VERSION}" \
            --body "Automated update after PyPI release ${VERSION}.\n\n- Package: ${PYPI_NAME}\n- Version: ${VERSION}\n- Source: PyPI sdist"