name: Open Bioconda Recipe PR

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to submit (example: 1.3.1)."
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PYPI_NAME: tau-community-detection
  RECIPE_PATH: recipes/tau-community-detection/meta.yaml
  UPSTREAM_BIOCONDA_REPO: bioconda/bioconda-recipes

jobs:
  open-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          INPUT_VERSION="${{ github.event.inputs.version }}"
          if [[ -n "${INPUT_VERSION}" ]]; then
            VERSION="${INPUT_VERSION#v}"
          elif [[ "${{ github.event_name }}" == "release" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            echo "No version available. Use workflow_dispatch and provide version."
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Get sdist metadata from PyPI
        id: pypi
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          python - <<'PY'
import json
import os
import urllib.request

pypi_name = os.environ["PYPI_NAME"]
version = os.environ["VERSION"]
url = f"https://pypi.org/pypi/{pypi_name}/{version}/json"

with urllib.request.urlopen(url) as response:
    payload = json.load(response)

sdist = next((item for item in payload.get("urls", []) if item.get("packagetype") == "sdist"), None)
if sdist is None:
    raise SystemExit(f"No sdist found for {pypi_name} {version}")

output = os.environ["GITHUB_OUTPUT"]
with open(output, "a", encoding="utf-8") as fh:
    fh.write(f"sha256={sdist['digests']['sha256']}\n")
PY
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Checkout bioconda-recipes fork
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.BIOCONDA_FORK_REPO }}
          token: ${{ secrets.BIOCONDA_TOKEN }}
          ref: master
          path: bioconda-recipes

      - name: Update recipe version and sha
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          SHA256="${{ steps.pypi.outputs.sha256 }}"
          FILE="bioconda-recipes/${RECIPE_PATH}"

          python - <<'PY'
import os
import re
from pathlib import Path

file_path = Path(os.environ["FILE"])
version = os.environ["VERSION"]
sha256 = os.environ["SHA256"]

text = file_path.read_text(encoding="utf-8")

new_text, version_count = re.subn(
    r'^(\s*\{\%\s*set\s+version\s*=\s*")[^"]+("\s*\%\}\s*)$',
    rf'\g<1>{version}\2',
    text,
    flags=re.MULTILINE,
)

if version_count == 0:
    new_text, version_count = re.subn(
        r'^(\s*version:\s*)[0-9A-Za-z._-]+(\s*)$',
        rf'\g<1>{version}\2',
        new_text,
        flags=re.MULTILINE,
    )

new_text, sha_count = re.subn(
    r'^(\s*sha256:\s*)[0-9a-f]{64}(\s*)$',
    rf'\g<1>{sha256}\2',
    new_text,
    flags=re.MULTILINE,
)

if version_count == 0:
    raise SystemExit("Could not find a version field in the Bioconda recipe")
if sha_count == 0:
    raise SystemExit("Could not find a sha256 field in the Bioconda recipe")

file_path.write_text(new_text, encoding="utf-8")
PY
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA256: ${{ steps.pypi.outputs.sha256 }}
          FILE: bioconda-recipes/${{ env.RECIPE_PATH }}

      - name: Commit and push branch
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          BRANCH="bump-${PYPI_NAME}-${VERSION}"

          cd bioconda-recipes
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "${BRANCH}"

          if git diff --quiet -- "${RECIPE_PATH}"; then
            echo "No recipe changes detected."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git add "${RECIPE_PATH}"
          git commit -m "bioconda: bump ${PYPI_NAME} to ${VERSION}"
          git push --force-with-lease origin "${BRANCH}"

          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Open or update PR
        if: steps.commit.outputs.has_changes == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.BIOCONDA_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          BRANCH="${{ steps.commit.outputs.branch }}"
          HEAD_REF="${{ secrets.BIOCONDA_FORK_OWNER }}:${BRANCH}"

          EXISTING_PR_NUMBER="$(gh pr list \
            --repo "${UPSTREAM_BIOCONDA_REPO}" \
            --head "${HEAD_REF}" \
            --json number \
            --jq '.[0].number')"

          if [[ -n "${EXISTING_PR_NUMBER}" ]]; then
            echo "PR #${EXISTING_PR_NUMBER} already exists for ${HEAD_REF}."
            exit 0
          fi

          gh pr create \
            --repo "${UPSTREAM_BIOCONDA_REPO}" \
            --base master \
            --head "${HEAD_REF}" \
            --title "bioconda: bump ${PYPI_NAME} to ${VERSION}" \
            --body "Automated update after PyPI release ${VERSION}.\n\n- Package: ${PYPI_NAME}\n- Version: ${VERSION}\n- Source: PyPI sdist"